[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kb65he-linux"
dynamic = ["version"]
description = "Unofficial Linux configurator for the Endgame Gear KB65HE 8k (actuation, lighting)"
readme = "README.md"
license = { text = "GPL-3.0-only" }
authors = [{ name = "Julian Friedle" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware :: Hardware Drivers",
]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
dev = ["pytest"]

[project.scripts]
kb65he = "kb65he.cli:main"

[project.gui-scripts]
kb65he-gui = "kb65he.gui.app:main"

[project.urls]
Homepage = "https://github.com/JulianFriedle/kb65he-linux"
Issues = "https://github.com/JulianFriedle/kb65he-linux/issues"

[tool.setuptools.dynamic]
version = { attr = "kb65he.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kb65he.gui" = ["icon.svg"]
