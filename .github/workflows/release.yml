name: Test & Release

# Runs on GitHub-hosted runners (free for public repositories).
# Tests run on every push and pull request. A release is created automatically
# whenever the version in src/kb65he/__init__.py changes on main and no tag for
# it exists yet.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  deb:
    # build the .deb and install it the way a user would (system PyQt6)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build .deb
        run: packaging/build-deb.sh dist
      - name: Install with apt
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ./dist/kb65he_*_all.deb
      - name: Smoke test
        env:
          QT_QPA_PLATFORM: offscreen
          KB65HE_QT: pyqt6
        run: |
          kb65he --version
          kb65he --demo actuation 0.5 W A S D
          /usr/bin/python3 -c "from kb65he.gui.app import MainWindow; from kb65he.gui.qt import QApplication, API; app = QApplication([]); w = MainWindow(demo=True); print('GUI ok with', API)"
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  release:
    needs: [test, deb]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version
        id: v
        run: |
          VERSION=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('src/kb65he/__init__.py').read()).group(1))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag v$VERSION already exists - no release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.v.outputs.exists == 'false'
        run: |
          pip install build
          python -m build
          packaging/build-deb.sh dist

      - name: Create release
        if: steps.v.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.v.outputs.version }}
          generate_release_notes: true
          files: dist/*
