name: Test & Release

# Runs on the maintainer's self-hosted runner (label "kb65he").
# SECURITY: this repository is public. Never add `pull_request` /
# `pull_request_target` triggers here - that would let anyone run code on the
# runner machine. Only pushes to main (maintainer only) and manual runs.
#
# A release is created automatically whenever the version in
# src/kb65he/__init__.py changes on main and no tag for it exists yet.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test-and-release:
    runs-on: [self-hosted, linux, kb65he]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up venv
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/pip install -q --upgrade pip
          .ci-venv/bin/pip install -q -e ".[dev]" build

      - name: Test
        run: .ci-venv/bin/pytest -q

      - name: Read version
        id: v
        run: |
          VERSION=$(.ci-venv/bin/python -c "import kb65he; print(kb65he.__version__)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag v$VERSION already exists - no release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.v.outputs.exists == 'false'
        run: |
          rm -rf dist
          .ci-venv/bin/python -m build

      - name: Create release
        if: steps.v.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.v.outputs.version }}
          generate_release_notes: true
          files: dist/*

      - name: Clean up
        if: always()
        run: rm -rf .ci-venv dist build src/*.egg-info
